what_this_cell_tests:
- 'Legacy derived-aux angular supervision (A3) with the line graph (3 ALIGNN layers, 3 pair convs): the
  manuscript''s ''proposed'' arm before the state was made independent.'
- Carries radius topology + gated pair messages, as every angular cell does (continuity rides with the
  angular factor).
- Originally queued as job 12965; cancelled before start to give its slot to alex_B3, then re-queued as
  job 13084 on the user's request.
