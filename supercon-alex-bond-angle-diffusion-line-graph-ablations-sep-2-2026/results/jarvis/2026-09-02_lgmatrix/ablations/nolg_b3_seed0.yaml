what_this_cell_tests:
- 'Independent bond-angle diffusion (B3, angle_mode=independent) with no line graph (9 pair convs, parameter-matched):
  persistent dense triplet index, own wrapped-normal VE kernel, jointly denoised, discarded at readout.'
- Angular state reaches coordinates only through the shared trunk's gradient (z = emb(phi) + y_ij + y_jk
  after the pair convs).
