- 'Independent bond-angle diffusion (B3) with the line graph (3 ALIGNN layers, 3 pair convs): the proposed
  model; angular state couples forward through angles -> bonds -> atoms.'
- This is the only cell whose first generation attempt aborted (lattice divergence in one crystal); regenerated
  with the quarantine sampler.
- 'Job 12969 trained to completion then FAILED in generate chunk 1/4 (FloatingPointError: non-finite lattice);
  job 13082 re-ran generate+score only.'
